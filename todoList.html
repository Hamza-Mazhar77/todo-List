<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo-List Project</title>
  <link rel="stylesheet" href="todoList.css" />
</head>

<body>
  <div class="container">
    <p class="heading">Todo List</p>
    <div class="todo-input-grid">
      <input type="text" placeholder="Todo name" class="name-input name" />
      <input type="date" class="dueDate-input dueDate" />
      <button class="add-button add-todo-button">Add</button>
    </div>
    <div class="todo todo-grid"></div>
  </div>
  <script src="todoList.js"></script>
</body>

</html>
